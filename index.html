<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Australia's International Tourism</title>

    <!-- Vega Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

    <style>
        body {
            font-family: Georgia, serif;
            background-color: #f5efe6;
            margin: 0;
            padding: 40px;
            color: #1a1a1a;
        }

        h1 {
            color: #1a4a6b;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 40px;
            color: #555;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }
    </style>
</head>

<body>

    <h1>Australia's International Tourism</h1>

    <p class="subtitle">
        Who visits Australia and how tourism shapes the economy.
    </p>

    <div class="chart-container">
        <div id="vis"></div>
    </div>

    <script>
        vegaEmbed("#vis", {
            "$schema": "https://vega.github.io/schema/vega-lite/v5.json",

            "title": {
                "text": "Top Countries Visiting Australia (2025)",
                "fontSize": 18,
                "anchor": "start",
                "color": "#1a4a6b"
            },

            "width": 700,
            "height": 400,

            "data": {
                "url": "https://raw.githubusercontent.com/Yukthahasini/FIT2179DV2/main/data/countries.csv"
            },

            "mark": {
                "type": "bar",
                "cornerRadiusEnd": 4
            },

            "encoding": {

                "y": {
                    "field": "country",
                    "type": "nominal",
                    "sort": "-x",
                    "title": null
                },

                "x": {
                    "field": "trips_2025",
                    "type": "quantitative",
                    "title": "Arrivals ('000)"
                },

                "color": {
                    "value": "#4f81bd"
                },

                "tooltip": [
                    {
                        "field": "country",
                        "type": "nominal",
                        "title": "Country"
                    },
                    {
                        "field": "trips_2025",
                        "type": "quantitative",
                        "title": "Arrivals ('000)"
                    }
                ]
            }
        });
    </script>

</body>

</html>
